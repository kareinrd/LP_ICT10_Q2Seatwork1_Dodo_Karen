<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Quarter 2 Seatwork</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #f3d8d8;
            font-family: Arial, sans-serif;
        }

        .cover {
            box-sizing: border-box;
            width: min(380px, calc(100% - 32px));
            padding: 30px;
            border-left: 14px solid #000000;
            border-radius: 8px;
            background: #f6a7a7;
            text-align: center;
        }

        .book-mark { font-size: 48px; }
        h1 { font-family: Georgia, serif; }
        .tagline { color: #000000; }

        form {
            display: grid;
            gap: 10px;
        }

        input {
            padding: 12px;
            border: 1px solid #c9bea5;
            border-radius: 4px;
            font-size: 16px;
        }

        input[type="button"] {
            border: 0;
            background: #a54e65;
            color: white;
            cursor: pointer;
        }

        #result { margin-top: 15px; }
    </style>
</head>
<body>
    <article class="cover">
        <h1>🌈</h1>
        <h1>Rainbow Catering</h1>
        <p class="tagline">A club for people who love to cook and celebrate.</p>
        <form onkeydown="if (event.key === 'Enter') { event.preventDefault(); document.getElementById('enter_button').click(); }"> <!-- makes the enter button functional -->
            <input type="text" id="first name" placeholder="First name" aria-label="First name">
            <input type="text" id="last name" placeholder="Last name" aria-label="Last name">
            <input type="button" id="enter_button" py-click="candidate_checker" value="Enter">
        </form>
         <div id="result" aria-live="polite"></div> <!-- makes/shows the result after entering the name and pressing enter -->
    </article>
    <py-script src="main.py"></py-script>
</body>
</html>
